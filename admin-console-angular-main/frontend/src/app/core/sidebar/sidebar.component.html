<nav class="sidebar">
  <div class="nav-list">
    <a 
      *ngFor="let item of navItems" 
      [routerLink]="item.route"
      class="nav-item"
      [class.active]="item.route === activeRoute"
      (click)="setActive(item.route)"
    >
      <mat-icon>{{ item.icon }}</mat-icon>
      <span class="nav-text">{{ item.name }}</span>
    </a>
  </div>
</nav>
